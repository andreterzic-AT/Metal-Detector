name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Mit eigener Domain (Variable PAGES_CUSTOM_DOMAIN, z. B. test.at-teamtools.de) liegt die App direkt
          # unter der Domain, sonst unter andreterzic-at.github.io/<Repository-Name>/
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_CUSTOM_DOMAIN == '' && format('/{0}', github.event.repository.name) || '' }}
          # Adresse des KI-Servers (Variable AI_PROXY_URL, z. B. https://metal-detector-ai.<name>.workers.dev)
          NEXT_PUBLIC_AI_URL: ${{ vars.AI_PROXY_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
