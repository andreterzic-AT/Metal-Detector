name: Deploy KI-Server (Cloudflare)

on:
  push:
    branches: [main, master]
    paths:
      - "worker/**"
      - "lib/ai-tools.ts"
      - "lib/profile.ts"
      - ".github/workflows/deploy-ai.yml"
  workflow_dispatch:

concurrency:
  group: ai-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten prüfen
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$AI_KEY" ]; then
            echo "::notice::KI-Server nicht eingerichtet – CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID oder ANTHROPIC_API_KEY fehlt. Siehe README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Abhängigkeiten installieren
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npm ci
      - name: Auf Cloudflare veröffentlichen
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.158.0"
          secrets: |
            ANTHROPIC_API_KEY
