name: Android-App bauen

# Baut die Android-App (Trusted Web Activity) als .aab für den Play Store und als .apk zum Testen.
# Start: Actions → "Android-App bauen" → "Run workflow".
#
# Benötigtes Secret: ANDROID_KEYSTORE_PASSWORD (selbst ausgedachtes, langes Passwort).
# Beim ersten Lauf wird der Upload-Schlüssel erzeugt, mit diesem Passwort verschlüsselt
# (AES-256) und als android/upload-keystore.p12.enc ins Repo gelegt. Ohne Passwort ist die
# Datei wertlos. Danach wird immer derselbe Schlüssel verwendet.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versionsname (z. B. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Versionsnummer – bei jedem Upload in den Play Store um 1 erhöhen"
        required: true
        default: "1"

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret prüfen
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ ${#KS_PASS} -lt 16 ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD ist zu kurz – bitte mindestens 16 Zeichen."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Upload-Schlüssel erzeugen oder entschlüsseln
        working-directory: android
        run: |
          if [ -f upload-keystore.p12.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in upload-keystore.p12.enc -out upload-keystore.p12 -pass env:KS_PASS
          else
            keytool -genkeypair -v -storetype PKCS12 -keystore upload-keystore.p12 -alias upload \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=AT-Teamtools Andre Terzic, O=AT-Teamtools, L=Huenstetten, C=DE"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in upload-keystore.p12 -out upload-keystore.p12.enc -pass env:KS_PASS
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add upload-keystore.p12.enc
            git commit -m "Android: verschlüsselten Upload-Schlüssel ablegen [skip ci]"
            git push
          fi
          echo "## Upload-Schlüssel" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore upload-keystore.p12 -storepass "$KS_PASS" -alias upload | grep -E "SHA256:" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Version setzen
        working-directory: android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ inputs.version_code }}/; s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Bauen
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Signieren
        working-directory: android
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p ../dist
          cp app/build/outputs/bundle/release/app-release.aab ../dist/metal-detector-${{ inputs.version_name }}.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload-keystore.p12 -storetype PKCS12 \
            -storepass "$KS_PASS" ../dist/metal-detector-${{ inputs.version_name }}.aab upload
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks upload-keystore.p12 --ks-type PKCS12 --ks-key-alias upload \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out ../dist/metal-detector-${{ inputs.version_name }}.apk aligned.apk
          "$BT/apksigner" verify ../dist/metal-detector-${{ inputs.version_name }}.apk
          rm -f upload-keystore.p12 aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: metal-detector-android-${{ inputs.version_name }}
          path: dist/
          retention-days: 30
