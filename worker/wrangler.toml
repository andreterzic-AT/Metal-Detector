# Metal Detector – KI-Server auf Cloudflare Workers
name = "metal-detector-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Erreichbar unter <name>.<subdomain>.workers.dev, aber ohne zusätzliche Vorschau-Adressen pro Version
workers_dev = true
preview_urls = false

[vars]
# Nur diese Seiten dürfen den Server benutzen
ALLOWED_ORIGINS = "https://at-metaldetector.de,https://www.at-metaldetector.de,https://test.at-teamtools.de,https://app.at-teamtools.de,https://andreterzic-at.github.io,http://localhost:3000"
# Tageslimit für alle Nutzer zusammen: eine Haiku-Anfrage = 1 Einheit, eine Opus-Anfrage = OPUS_COST Einheiten.
# Eine Chat-Nachricht braucht je nach Werkzeugen 1–4 Anfragen.
DAILY_BUDGET = "1000"
OPUS_COST = "25"
# Eine KI-Bandsuche (Websuche, ca. 1-3 Cent) zählt so viele Einheiten. Bereits recherchierte Bands kosten nichts.
BAND_COST = "20"

# Höchstens 20 Anfragen pro Minute und Nutzer (IP)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetCounter"

[[durable_objects.bindings]]
name = "BAND_CACHE"
class_name = "BandCache"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetCounter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BandCache"]
